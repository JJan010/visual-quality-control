[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-quality-control"
version = "0.1.0"
description = "Visual anomaly detection for manufacturing quality control"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["visual_quality*"]

[tool.setuptools.package-data]
"visual_quality.api" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
]
